name: Klipt
options:
  bundleIdPrefix: app.klipt
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: Klipt
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 7CMPG6N65Y
    # Both are overridden per-build by scripts/build-release.sh. "dev" marks a
    # plain Xcode build that didn't go through the release script.
    KLIPT_GIT_REVISION: dev

targets:
  Klipt:
    type: application
    platform: macOS
    sources:
      - path: Klipt
    settings:
      base:
        INFOPLIST_FILE: Klipt/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Klipt/Resources/Klipt.entitlements
        ENABLE_HARDENED_RUNTIME: true
      configs:
        # Debug signs the same way as Release. Ad-hoc would be lighter, but
        # CloudKit entitlements are restricted — they only sign against a
        # provisioning profile — so an ad-hoc debug build cannot exercise sync
        # at all, which is precisely what needs exercising.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "Kliipt Developer ID"
        # Distribution: Developer ID + secure timestamp, required for notarization.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # CloudKit entitlements are only honoured when backed by a profile,
          # which Xcode embeds as Contents/embedded.provisionprofile.
          PROVISIONING_PROFILE_SPECIFIER: "Kliipt Developer ID"
    # xcodegen regenerates the entitlements file from these properties on every
    # run, so this block is the source of truth — editing the .entitlements file
    # directly gets silently overwritten, and the keys vanish from the signature.
    entitlements:
      path: Klipt/Resources/Klipt.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.app.klipt.Klipt]
        # Without this CloudKit talks to the development database, which is not
        # the one a shipped build should ever see.
        com.apple.developer.icloud-container-environment: Production
