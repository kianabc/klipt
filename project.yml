name: Klipt
options:
  bundleIdPrefix: app.klipt
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: Klipt
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 7CMPG6N65Y
    # Both are overridden per-build by scripts/build-release.sh. "dev" marks a
    # plain Xcode build that didn't go through the release script.
    KLIPT_GIT_REVISION: dev

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Klipt:
    type: application
    platform: macOS
    sources:
      - path: Klipt
    dependencies:
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: Klipt/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Klipt/Resources/Klipt.entitlements
        ENABLE_HARDENED_RUNTIME: true
      configs:
        # Local dev: ad-hoc sign so a build never needs the Developer ID cert.
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
        # Distribution: Developer ID + secure timestamp, required for notarization.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    entitlements:
      path: Klipt/Resources/Klipt.entitlements
      properties:
        com.apple.security.automation.apple-events: true
